services:
  db:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: sanskar
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanskar -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./Social
    ports:
      - 8080:8080
    env_file:
      - ./Social/.envrc
    volumes:
      - ./Social:/usr/src/app
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
