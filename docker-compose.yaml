services:
  db:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: sanskar
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: social
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanskar -d social"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./Social
    ports:
      - 8080:8080
      - 2345:2345
    env_file:
      - ./Social/.envrc
    environment:
      DB_ADDR: "postgres://sanskar:adminpassword@db:5432/social?sslmode=disable"
    volumes:
      - ./Social:/usr/src/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
